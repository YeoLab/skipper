################################# BASIC INPUTS (required for all runs) ####################################

# Required work/organizational files. 
WORKDIR: /tscc/lustre/ddn/scratch/YOUR_USERNAME/skipper2_test
MANIFEST: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/example/yeo_lab_internal_example_manifest.csv
TOOL_DIR: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/tools

# Required Annotation Files
GFF: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/gencode.v49.filtered.annotation.gff3.gz
GENOME: /tscc/projects/ps-yeolab3/bay001/annotations/GRCh38/GRCh38_no_alt_analysis_set_GCA_000001405.15.fasta
ACCESSION_RANKINGS: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/accession_type_ranking.txt
BLACKLIST: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/encode3_eclip_blacklist.bed # Leave blank for no blacklist.

# Auto Generated Annotation Files.
# MUST still specify paths/names so skipper knows where to save generated files to!
PARTITION: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/gencode.v49.annotation.tiled_partition.bed.gz
FEATURE_ANNOTATIONS: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/gencode.v49.annotation.tiled_partition.features.tsv.gz
STAR_DIR: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/gencode.v49_star_ref

# eCLIP Parameters
protocol: ENCODE4 # ENCODE4 for single end, ENCODE3 for paired end.
UMI_SIZE: 10
INFORMATIVE_READ: 1
OVERDISPERSION_MODE: input   # input or clip, input is reccomended
GINI_CUTOFF: 0.9
NORMALIZATION_MODE: new # new or classic
THRESHOLD_MIN: 2

################################# ADVANCED INPUTS (required for additional analyses) ####################################

HOMER: True

# Repeat analysis. Leave blank to only perform analysis on non-repetitive regions. 
REPEAT_TABLE: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/repeatmasker.grch38.tsv.gz
REPEAT_BED: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/repeatmasker.grch38.sort.unique.bed.gz # Can be auto generated by Skipper.

# Gene set analysis. Leave blank to skip gene set analysis. 
GENE_SETS: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/c5.go.v7.5.1.symbols.gmt
GENE_SET_REFERENCE: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/encode3_go_terms.reference.tsv.gz
GENE_SET_DISTANCE: /tscc/projects/ps-yeolab4/software/skipper/2.0.0/bin/skipper/annotations/encode3_go_terms.jaccard_index.rds